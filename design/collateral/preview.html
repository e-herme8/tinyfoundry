<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TinyFoundry Collateral Preview</title>
  <style>
    :root { color-scheme: dark; --bg:#08090a; --paper:#f7f8f8; --ember:#d96b3b; --violet:#8fa5ff; --warm:#e8e2d8; }
    body { margin:0; background:var(--bg); color:var(--paper); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:56px 24px 96px; }
    h1 { font-size: clamp(48px, 8vw, 112px); line-height:.88; letter-spacing:-.07em; margin:0 0 16px; }
    p { color:#a1a1aa; line-height:1.7; max-width:760px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:18px; margin-top:28px; }
    figure { margin:0; border:1px solid rgba(255,255,255,.12); border-radius:28px; background:#111316; padding:18px; min-height:180px; display:flex; flex-direction:column; justify-content:space-between; }
    figure.light { background:var(--warm); color:#08090a; }
    img { width:100%; height:auto; display:block; object-fit:contain; border-radius:18px; }
    figcaption { margin-top:12px; font: 700 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; text-transform:uppercase; color:#d6d0c6; overflow-wrap:anywhere; }
    figure.light figcaption { color:#4a4138; }
    .wide { grid-column: 1 / -1; }
    .mark { max-width:128px; }
  </style>
</head>
<body>
<main>
  <h1>TINYFOUNDRY<br/>COLLATERAL PACK</h1>
  <p>Local SVG assets for Juliet to integrate into the TinyFoundry landing page. Inspired by Juna/Gyld's collectible card visual system and Antaeus Travel's editorial scale, thin rules, circles, and whitespace.</p>
  <section class="grid">
    <figure><img class="mark" src="../../assets/collateral/brand/tf-mark-anvil.svg" alt="TinyFoundry Anvil TF mark"><figcaption>brand/tf-mark-anvil.svg</figcaption></figure>
    <figure class="wide"><img src="../../assets/collateral/hero/tf-hero-forge-workbench.svg" alt="TinyFoundry forge workbench transformation"><figcaption>hero/tf-hero-forge-workbench.svg</figcaption></figure>
    <figure class="wide"><img src="../../assets/collateral/hero/tf-hero-overlap-cards.svg" alt="TinyFoundry overlapping cards"><figcaption>hero/tf-hero-overlap-cards.svg</figcaption></figure>
    <figure><img src="../../assets/collateral/hero/tf-hero-local-files-card.svg" alt="Local files card"><figcaption>hero/tf-hero-local-files-card.svg</figcaption></figure>
    <figure><img src="../../assets/collateral/hero/tf-hero-ai-provider-card.svg" alt="AI provider card"><figcaption>hero/tf-hero-ai-provider-card.svg</figcaption></figure>
    <figure><img src="../../assets/collateral/hero/tf-hero-automation-card.svg" alt="Automation card"><figcaption>hero/tf-hero-automation-card.svg</figcaption></figure>
    <figure><img src="../../assets/collateral/hero/tf-hero-desktop-app-card.svg" alt="Desktop app card"><figcaption>hero/tf-hero-desktop-app-card.svg</figcaption></figure>
    <figure class="wide light"><img src="../../assets/collateral/sections/tf-section-foundry-flow-line.svg" alt="Foundry flow line"><figcaption>sections/tf-section-foundry-flow-line.svg</figcaption></figure>
    <figure class="wide"><img src="../../assets/collateral/sections/tf-section-trust-boundary.svg" alt="Local trust boundary"><figcaption>sections/tf-section-trust-boundary.svg</figcaption></figure>
    <figure class="wide"><img src="../../assets/collateral/sections/tf-section-demo-triptych.svg" alt="Demo triptych"><figcaption>sections/tf-section-demo-triptych.svg</figcaption></figure>
    <figure class="wide light"><img src="../../assets/collateral/sections/tf-section-circles-warm-gray.svg" alt="Editorial circles"><figcaption>sections/tf-section-circles-warm-gray.svg</figcaption></figure>
  </section>
</main>
</body>
</html>
